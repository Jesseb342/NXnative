name: Build IPA from NSP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Debug - show repo contents
        shell: bash
        run: |
          pwd
          ls -la
          git log -1 --oneline
          echo "Python files found:"
          find . -name "*.py" -not -path "./.git/*" | head -n 50

      - name: Securely download game, update, and keys
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        run: |
          set -euo pipefail
          pip install --quiet gdown
          mkdir -p build_stage

          RE_PATH='/d/([A-Za-z0-9_-]+)'
          RE_QUERY='[?&]id=([A-Za-z0-9_-]+)'
          HTML_PATTERN='<html|<!doctype'

          fetch() {
            local name="$1"
            local url="$2"
            local out="$3"
            local id=""

            if [ -z "$url" ]; then
              echo "::error::Secret for $name is empty or not passed to this step"
              exit 1
            fi

            if [[ "$url" =~ $RE_PATH ]]; then
              id="${BASH_REMATCH[1]}"
            elif [[ "$url" =~ $RE_QUERY ]]; then
              id="${BASH_REMATCH[1]}"
            fi

            if [ -z "$id" ]; then
              echo "::error::Could not find a Drive file ID in the $name secret"
              exit 1
            fi
            echo "$name: file ID has ${#id} characters"

            gdown "https://drive.google.com/uc?id=$id" -O "$out"

            if head -c 1024 "$out" | grep -qiE "$HTML_PATTERN"; then
              echo "::error::$name downloaded as an HTML page, not the real file"
              exit 1
            fi
            ls -lh "$out"
          }

          fetch Keys   "$KEYS_URL"   build_stage/prod.keys
          fetch Game   "$GAME_URL"   build_stage/game.nsp
          fetch Update "$UPDATE_URL" build_stage/update.nsp

          echo "Contents of build_stage:"
          ls -lh build_stage

      - name: Build IPA
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="scripts/build_ipa_from_nsp.py"
          if [ ! -f "$SCRIPT" ]; then
            SCRIPT=$(find . -iname "build_ipa_from_nsp.py" -not -path "./.git/*" | head -n1)
          fi
          if [ -z "$SCRIPT" ] || [ ! -f "$SCRIPT" ]; then
            echo "::error::build_ipa_from_nsp.py is not in this commit."
            exit 1
          fi

          echo "Using script: $SCRIPT"
          python3 "$SCRIPT" build_stage -k build_stage/prod.keys

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: built-ipa
          path: |
            **/*.ipa
          if-no-files-found: warn

      - name: Clean up sensitive files
        if: always()
        shell: bash
        run: |
          rm -rf build_stage
