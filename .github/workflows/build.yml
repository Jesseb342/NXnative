      - name: Securely download game, update, and keys
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        run: |
          set -euo pipefail
          pip install --quiet gdown
          mkdir -p build_stage

          fetch() {
            local name="$1" url="$2" out="$3"
            if [ -z "$url" ]; then
              echo "::error::Secret for $name is empty or not passed to this step"
              exit 1
            fi
            # Works for /d/ID/view links and uc?id=ID / download?id=ID links
            local id
            id=$(echo "$url" | sed -nE 's#.*/d/([A-Za-z0-9_-]+).*#\1#p; s#.*[?&]id=([A-Za-z0-9_-]+).*#\1#p' | head -n1)
            if [ -z "$id" ]; then
              echo "::error::Could not find a Drive file ID in the $name secret"
              exit 1
            fi
            echo "$name: file ID has ${#id} characters"
            gdown "https://drive.google.com/uc?id=$id" -O "$out"
            if head -c 1024 "$out" | grep -qiE '<html|<!doctype'; then
              echo "::error::$name downloaded as an HTML page, not the real file"
              exit 1
            fi
            ls -lh "$out"
          }

          fetch Keys   "$KEYS_URL"   build_stage/prod.keys
          fetch Game   "$GAME_URL"   build_stage/game.nsp
          fetch Update "$UPDATE_URL" build_stage/update.nsp
