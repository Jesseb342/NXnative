name: Build IPA from NSP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Enable this only if the script lives in a different repo.
      # Replace OWNER/REPO and the path in the Build step below.
      # - name: Checkout script repo
      #   uses: actions/checkout@v4
      #   with:
      #     repository: OWNER/REPO
      #     path: script_repo
      #     token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Debug - show repo contents
        shell: bash
        run: |
          pwd
          ls -la
          git log -1 --oneline
          echo "Python files found:"
          find . -name "*.py" -not -path "./.git/*" | head -n 50

      - name: Securely download game, update, and keys
        shell: bash
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        run: |
          set -euo pipefail
          pip install --quiet gdown
          mkdir -p build_stage

          fetch() {
            local name="$1" url="$2" out="$3"
            if [ -z "$url" ]; then
              echo "::error::Secret for $name is empty or not passed to this step"
              exit 1
            fi

            local id
            id=$(echo "$url" | sed -nE 's#.*/d/([A-Za-z0-9_-]+).*#\1#p; s#.*[?&]id=([A-Za-z0-9_-]+).*#\1#p' | head -n1)
            if [ -z "$id" ]; then
              echo "::error::Could not find a Drive file ID in the $name secret"
              exit 1
            fi
            echo "$name: file ID has ${#id} characters"

            gdown "https://drive.google.com/uc?id=$id" -O "$out"

            if head -c 1024 "$out" | grep -qiE '<html|
